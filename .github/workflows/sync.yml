name: Tarik Laporan Program Prioritas

on:
  workflow_dispatch:

concurrency:
  group: zendesk-program-prioritas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install library
        run: pip install -r requirements.txt

      - name: Tarik data Zendesk dan kirim ke Google Sheet
        env:
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python laporan_program_prioritas.py
